name: Build PWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/googlechromelabs/bubblewrap:latest
      options: --user root
    timeout-minutes: 20

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Criar twa-manifest.json
      run: |
        cat <<EOF > twa-manifest.json
        {
          "packageId": "com.dadsondankstrycrypto.pokerpwa",
          "host": "dadsondankstry-crypto.github.io",
          "name": "Poker PWA",
          "launcherName": "Poker",
          "display": "standalone",
          "themeColor": "#0a4d2e",
          "navigationColor": "#0a4d2e",
          "backgroundColor": "#0a4d2e",
          "startUrl": "/poker-pwa/",
          "iconUrl": "https://dadsondankstry-crypto.github.io/poker-pwa/icon-512.png",
          "maskableIconUrl": "https://dadsondankstry-crypto.github.io/poker-pwa/icon-512.png",
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "shortcuts": [],
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://dadsondankstry-crypto.github.io/poker-pwa/manifest.json",
          "fallbackType": "customtabs",
          "features": {},
          "alphaDependencies": { "enabled": false },
          "enableNotifications": false,
          "isMetaQuest": false,
          "fullScopeUrl": "https://dadsondankstry-crypto.github.io/poker-pwa/",
          "minSdkVersion": 21,
          "orientation": "portrait",
          "fingerprints": [],
          "additionalTrustedOrigins": [],
          "retainedBundles": []
        }
        EOF

    - name: Gerar Keystore de Teste
      run: |
        keytool -genkeypair -v \
          -keystore android.keystore \
          -alias poker-key \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass senha123 -keypass senha123 \
          -dname "CN=Poker PWA, OU=Dev, O=Poker, L=NA, ST=NA, C=BR"

    - name: Compilar APK
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: "senha123"
        BUBBLEWRAP_KEY_PASSWORD: "senha123"
      run: |
        echo "n" | bubblewrap build --manifest=./twa-manifest.json --skipPwaValidation

    - name: Upload do APK
      uses: actions/upload-artifact@v4
      with:
        name: poker-pwa-apk
        path: ./app-release-signed.apk
